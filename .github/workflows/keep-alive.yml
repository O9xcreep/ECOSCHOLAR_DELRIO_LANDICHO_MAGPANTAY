name: Keep backend awake

# Render's free plan spins the backend down after ~15 minutes with no traffic,
# and the next real request then has to wait for it to wake back up (can take
# a minute or more) - this pings the health endpoint often enough that it
# never goes idle long enough to sleep. Free, but not a guarantee: GitHub can
# delay scheduled runs under load, and disables `schedule` triggers on a repo
# after 60 days with no commits - if pings stop firing, push any commit to
# reactivate it. The real fix is a Render plan that doesn't spin down at all.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 90 https://ecoscholar-yktj.onrender.com/api/health
